<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Počasí</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px;
      background: #1a2332;
      color: #e8eef5;
      transition: background 0.4s ease, color 0.4s ease;
    }

    body.night-mode {
      background: #121820;
      color: #d0d8e4;
    }

    .card {
      width: 100%;
      max-width: 680px;
      background: #202d3b;
      border-radius: 16px;
      padding: 28px 32px;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    body.night-mode .card {
      background: #181f2a;
      border-color: rgba(255, 255, 255, 0.04);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: #8ba3c7;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #c5d4e8;
      border-color: rgba(255, 255, 255, 0.12);
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .day-title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f0f4f8;
      margin-bottom: 6px;
    }

    .date-info,
    .location-info {
      font-size: 0.9rem;
      color: #8ba3c7;
      font-weight: 500;
    }

    .location-info {
      margin-top: 4px;
      opacity: 0.85;
    }

    .current-weather {
      text-align: center;
      padding: 32px 20px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 28px;
    }

    .current-weather i {
      font-size: 3.8rem;
      color: #6bcfff;
      margin-bottom: 12px;
      display: inline-block;
    }

    .current-temp {
      font-size: 3.4rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #f0f4f8;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #6b829e;
      margin-bottom: 12px;
    }

    .forecast-section {
      margin-bottom: 8px;
    }

    .forecast-section + .forecast-section {
      margin-top: 24px;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }

    .forecast-card {
      background: rgba(0, 0, 0, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 14px 8px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .forecast-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .forecast-card i {
      font-size: 1.5rem;
      color: #6bcfff;
      margin-bottom: 6px;
      display: block;
    }

    .forecast-time {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #a8bdd4;
      margin-bottom: 2px;
    }

    .forecast-temp {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
      color: #e8eef5;
    }

    .footer-link {
      margin-top: 28px;
      display: inline-block;
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      color: #8ba3c7;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
    }

    .footer-link:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #c5d4e8;
      border-color: rgba(255, 255, 255, 0.12);
    }

    @media (max-width: 640px) {
      .card {
        padding: 22px 18px;
      }

      .day-title {
        font-size: 1.45rem;
      }

      .current-temp {
        font-size: 2.8rem;
      }

      .current-weather i {
        font-size: 3.2rem;
      }

      .forecast-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .forecast-card {
        padding: 12px 6px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-bar">
      <button class="icon-btn" onclick="showInfo()" title="Info">
        <i class="bi bi-info-lg"></i>
      </button>
      <button class="icon-btn" onclick="toggleNightMode()" title="Přepnout režim">
        <i id="mode-icon" class="bi"></i>
      </button>
    </div>

    <div class="header">
      <h1 class="day-title" id="day">Načítám...</h1>
      <p class="date-info" id="date">Načítám...</p>
      <p class="location-info">San Andreas · 37°50'N 47°49'W</p>
    </div>

    <div class="current-weather" id="current-weather">
      <i class="bi bi-hourglass-split"></i>
      <div class="current-temp">--°C</div>
    </div>

    <div class="forecast-section">
      <h3 class="section-title">Minulé hodiny</h3>
      <div class="forecast-grid" id="past-forecast"></div>
    </div>

    <div class="forecast-section">
      <h3 class="section-title">Následující hodiny</h3>
      <div class="forecast-grid" id="future-forecast"></div>
    </div>
  </div>

  <a href="https://artic.leosight.cz/zayatec.ic" target="_top" class="footer-link">ZAYA-TEC</a>

  <script>
    function toggleNightMode() {
      const body = document.body;
      body.classList.toggle('night-mode');
      const isNight = body.classList.contains('night-mode');
      localStorage.setItem('nightMode', isNight ? 'true' : 'false');
      updateModeIcon(isNight);
    }

    function updateModeIcon(isNight) {
      const icon = document.getElementById('mode-icon');
      icon.className = 'bi ' + (isNight ? 'bi-sun-fill' : 'bi-moon-stars-fill');
    }

    (function activateNightMode() {
      const saved = localStorage.getItem('nightMode');
      const now = new Date();
      const hour = now.getHours();
      const shouldBeNight = saved === 'true' || (saved === null && (hour >= 21 || hour < 6));
      if (shouldBeNight) {
        document.body.classList.add('night-mode');
      }
      updateModeIcon(document.body.classList.contains('night-mode'));
    })();

    document.addEventListener('DOMContentLoaded', function() {
      const now = new Date();
      const days = ['Neděle', 'Pondělí', 'Úterý', 'Středa', 'Čtvrtek', 'Pátek', 'Sobota'];
      const dayName = days[now.getDay()];
      const dateString = now.toLocaleDateString('cs-CZ', {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const timeString = `${hours}:${minutes}`;

      document.getElementById('day').textContent = dayName;
      document.getElementById('date').textContent = dateString + ' · ' + timeString;

      const latitude = 37.8336;
      const longitude = -47.8172;
      const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true&hourly=temperature_2m`;

      fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
          if (data && data.current_weather && data.hourly) {
            const temperature = data.current_weather.temperature;
            let iconClass = temperature > 16 ? 'bi-sun' : temperature > 10 ? 'bi-cloud-sun' : 'bi-cloud';
            document.getElementById('current-weather').innerHTML = `
              <i class="bi ${iconClass}"></i>
              <div class="current-temp">${temperature}°C</div>
            `;

            const pastForecast = document.getElementById('past-forecast');
            const futureForecast = document.getElementById('future-forecast');

            for (let i = 6; i >= 1; i--) {
              const pastHourIndex = (now.getHours() - i + 24) % 24;
              const pastTemperature = data.hourly.temperature_2m[pastHourIndex];
              let forecastIconClass = pastTemperature > 16 ? 'bi-sun' : pastTemperature > 10 ? 'bi-cloud-sun' : 'bi-cloud';
              const card = document.createElement('div');
              card.className = 'forecast-card';
              card.innerHTML = `
                <i class="bi ${forecastIconClass}"></i>
                <span class="forecast-time">${pastHourIndex}:00</span>
                <span class="forecast-temp">${pastTemperature}°C</span>
              `;
              pastForecast.appendChild(card);
            }

            for (let i = 1; i <= 6; i++) {
              const futureHourIndex = (now.getHours() + i) % 24;
              const forecastTemperature = data.hourly.temperature_2m[futureHourIndex];
              let forecastIconClass = forecastTemperature > 16 ? 'bi-sun' : forecastTemperature > 10 ? 'bi-cloud-sun' : 'bi-cloud';
              const card = document.createElement('div');
              card.className = 'forecast-card';
              card.innerHTML = `
                <i class="bi ${forecastIconClass}"></i>
                <span class="forecast-time">${futureHourIndex}:00</span>
                <span class="forecast-temp">${forecastTemperature}°C</span>
              `;
              futureForecast.appendChild(card);
            }
          } else {
            document.getElementById('current-weather').innerHTML = '<div class="current-temp">Data nenalezena</div>';
          }
        })
        .catch(error => {
          console.error('Chyba při načítání dat:', error);
          document.getElementById('current-weather').innerHTML = '<div class="current-temp">Chyba načítání</div>';
        });
    });

    function showInfo() {
      alert('(( Veškeré údaje berte s rezervou, stránka není napojena na herní skript počasí a nesouvisí s náhodnými skriptovými událostmi - déšť, winterpack atd. ))');
    }
  </script>
</body>
</html>
