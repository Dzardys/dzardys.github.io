<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Timestamp Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #5865f2;
            --accent-hover: #4752c4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0f172a;
            --border-color: #334155;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            padding: 10px 12px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        .output-box {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .code-display {
            font-family: 'Courier New', Courier, monospace;
            color: #38bdf8;
            font-size: 1rem;
            word-break: break-all;
        }

        .preview-box {
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--accent-color);
            padding: 10px 12px;
            margin-top: 15px;
            border-radius: 0 6px 6px 0;
        }

        .preview-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .preview-value {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 100%;
            margin-top: 15px;
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .btn-copy {
            white-space: nowrap;
        }

        .btn-copy.copied {
            background-color: var(--success-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Stamper<h1>
    <div class="row">
        <div class="form-group">
            <label for="dateInput">Date</label>
            <input type="date" id="dateInput">
        </div>
        <div class="form-group">
            <label for="timeInput">Time</label>
            <input type="time" id="timeInput">
        </div>
    </div>

    <div class="form-group">
        <label for="typeSelect">Type</label>
        <select id="typeSelect">
            <option value="t">short time (e.g. 16:20)</option>
            <option value="T">long time (e.g. 16:20:30)</option>
            <option value="d">short date (e.g. 20/04/2026)</option>
            <option value="D">long date (e.g. 20 April 2026)</option>
            <option value="f">long date with short time (e.g. 20 April 2026 16:20)</option>
            <option value="F">long date with day of week and short time (e.g. Monday, 20 April 2026 16:20)</option>
            <option value="R">relative (e.g. in 2 hours / 2 months ago)</option>
        </select>
    </div>

    <div class="preview-box">
        <div class="preview-label">PREVIEW</div>
        <div class="preview-value" id="previewValue">-</div>
    </div>

    <div class="output-box">
        <span class="code-display" id="outputCode">&lt;t:0:t&gt;</span>
        <button class="btn btn-copy" id="copyBtn">Copy</button>
    </div>

    <button class="btn btn-secondary" id="resetBtn">Reset</button>
</div>

<script>
    const dateInput = document.getElementById('dateInput');
    const timeInput = document.getElementById('timeInput');
    const typeSelect = document.getElementById('typeSelect');
    const outputCode = document.getElementById('outputCode');
    const previewValue = document.getElementById('previewValue');
    const copyBtn = document.getElementById('copyBtn');
    const resetBtn = document.getElementById('resetBtn');

    function setNow() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');

        dateInput.value = `${year}-${month}-${day}`;
        timeInput.value = `${hours}:${minutes}`;
        updateTimestamp();
    }

    function updateTimestamp() {
        if (!dateInput.value || !timeInput.value) return;

        const dateObj = new Date(`${dateInput.value}T${timeInput.value}`);
        const unixTimestamp = Math.floor(dateObj.getTime() / 1000);
        const format = typeSelect.value;

        if (isNaN(unixTimestamp)) return;

        const code = `<t:${unixTimestamp}:${format}>`;
        outputCode.textContent = code;

        previewValue.textContent = formatPreview(dateObj, format);
    }

    function formatPreview(date, format) {
        switch (format) {
            case 't': return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            case 'T': return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            case 'd': return date.toLocaleDateString();
            case 'D': return date.toLocaleDateString([], { day: 'numeric', month: 'long', year: 'numeric' });
            case 'f': return `${date.toLocaleDateString([], { day: 'numeric', month: 'long', year: 'numeric' })} ${date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
            case 'F': return `${date.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })} ${date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
            case 'R': return getRelativeTime(date);
            default: return '';
        }
    }

    function getRelativeTime(date) {
        const now = new Date();
        const diffInSeconds = Math.floor((date - now) / 1000);
        const rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });

        const absDiff = Math.abs(diffInSeconds);
        if (absDiff < 60) return rtf.format(Math.round(diffInSeconds), 'second');
        if (absDiff < 3600) return rtf.format(Math.round(diffInSeconds / 60), 'minute');
        if (absDiff < 86400) return rtf.format(Math.round(diffInSeconds / 3600), 'hour');
        if (absDiff < 2592000) return rtf.format(Math.round(diffInSeconds / 86400), 'day');
        if (absDiff < 31536000) return rtf.format(Math.round(diffInSeconds / 2592000), 'month');
        return rtf.format(Math.round(diffInSeconds / 31536000), 'year');
    }

    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(outputCode.textContent).then(() => {
            copyBtn.textContent = 'Copied!';
            copyBtn.classList.add('copied');
            setTimeout(() => {
                copyBtn.textContent = 'Copy Code';
                copyBtn.classList.remove('copied');
            }, 2000);
        });
    });

    dateInput.addEventListener('input', updateTimestamp);
    timeInput.addEventListener('input', updateTimestamp);
    typeSelect.addEventListener('change', updateTimestamp);
    resetBtn.addEventListener('click', setNow);

    setNow();
</script>

</body>
</html>
