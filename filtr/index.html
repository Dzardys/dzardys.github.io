<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeoSight.cz – Filtr logů</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    color-scheme: dark;
    --bg:     #0d1317;
    --panel:  #131b21;
    --panel2: #19232a;
    --line:   #243139;
    --line2:  #33434d;
    --text:   #e3e9e6;
    --dim:    #8a9b94;
    --faint:  #5b6b65;
    --accent: #e2a94b;
    --accent-ink: #1b1306;

    --IC:      #f1f4f2;
    --OOC:     #73857d;
    --FACTION: #7fa4ff;
    --ME:      #b99cff;
    --DO:      #e39bd0;
    --RADIO:   #4cc9f0;

    --ui:   'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Code', Consolas, monospace;
  }

  html { background: var(--bg); }

  body {
    font-family: var(--ui);
    font-size: 15px;
    color: var(--text);
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .top {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 22px 32px;
    border-bottom: 1px solid var(--line);
  }
  .brand { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .brand span { color: var(--accent); }
  .top .sub { color: var(--dim); font-size: 14px; }

  .layout {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(320px, 400px) minmax(0, 1fr);
    gap: 0;
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
  }

  aside {
    padding: 28px 28px 28px 32px;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 22px;
    position: sticky;
    top: 0;
    align-self: start;
    max-height: 100vh;
    overflow-y: auto;
  }

  .field > .title {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .field > .title small { font-weight: 400; color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; }

  textarea {
    width: 100%;
    height: 220px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.65;
    resize: vertical;
    transition: border-color .15s;
  }
  textarea:hover { border-color: var(--line2); }
  textarea:focus { outline: none; border-color: var(--accent); }
  textarea::placeholder { color: var(--faint); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }

  .chip { position: relative; cursor: pointer; user-select: none; }
  .chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; margin: 0; }
  .chip > span {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px 7px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--faint);
    font-size: 14px;
    font-weight: 600;
    transition: background .15s, border-color .15s, color .15s;
  }
  .chip > span::before {
    content: '';
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--c, var(--dim));
    opacity: .35;
    transition: opacity .15s, transform .15s;
  }
  .chip .n { font-weight: 400; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .chip:hover > span { border-color: var(--line2); color: var(--dim); }
  .chip input:checked + span { background: var(--panel2); border-color: var(--line2); color: var(--text); }
  .chip input:checked + span::before { opacity: 1; transform: scale(1.1); }
  .chip input:checked + span .n { color: var(--dim); }
  .chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  .chip[data-t=IC]      { --c: var(--IC); }
  .chip[data-t=OOC]     { --c: var(--OOC); }
  .chip[data-t=FACTION] { --c: var(--FACTION); }
  .chip[data-t=ME]      { --c: var(--ME); }
  .chip[data-t=DO]      { --c: var(--DO); }
  .chip[data-t=RADIO]   { --c: var(--RADIO); }

  .toggles { display: flex; flex-direction: column; gap: 4px; }
  .toggle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; cursor: pointer; user-select: none;
    color: var(--dim); font-size: 14px;
  }
  .toggle:hover { color: var(--text); }
  .toggle input { position: absolute; opacity: 0; }
  .switch {
    width: 34px; height: 20px; border-radius: 999px;
    background: var(--line); position: relative; flex-shrink: 0;
    transition: background .15s;
  }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--dim); transition: transform .15s, background .15s;
  }
  .toggle input:checked + .switch { background: var(--accent); }
  .toggle input:checked + .switch::after { transform: translateX(14px); background: var(--accent-ink); }
  .toggle input:focus-visible + .switch { outline: 2px solid var(--accent); outline-offset: 2px; }

  main { min-width: 0; display: flex; flex-direction: column; }

  .bar {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 32px;
    border-bottom: 1px solid var(--line);
    min-height: 65px;
    position: sticky; top: 0; z-index: 2;
    background: var(--bg);
  }
  .bar .meta { color: var(--dim); font-size: 14px; font-variant-numeric: tabular-nums; margin-right: auto; }

  button {
    font-family: var(--ui);
    font-size: 14px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--line2);
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  button:hover { color: var(--text); border-color: var(--dim); }
  button:active { transform: translateY(1px); }
  button.copy { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.copy:hover { background: #efb85e; border-color: #efb85e; color: var(--accent-ink); }
  button.copy:disabled { background: transparent; border-color: var(--line); color: var(--faint); cursor: default; }
  button.copy.copied { background: var(--panel2); border-color: var(--line2); color: var(--text); }

  #output { padding: 12px 32px 48px; font-family: var(--mono); font-size: 13px; line-height: 1.7; }

  .line {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    column-gap: 18px;
    padding: 4px 12px 4px 14px;
    border-left: 3px solid var(--c, var(--line2));
    margin: 2px 0;
    border-radius: 0 4px 4px 0;
  }
  .line:not(:has(.ts)) { grid-template-columns: minmax(0, 1fr); }
  .line:hover { background: var(--panel); }

  .line[data-t=IC]      { --c: var(--IC); }
  .line[data-t=OOC]     { --c: var(--OOC); }
  .line[data-t=FACTION] { --c: var(--FACTION); }
  .line[data-t=ME]      { --c: var(--ME); }
  .line[data-t=DO]      { --c: var(--DO); }
  .line[data-t=RADIO]   { --c: var(--RADIO); }

  .ts { color: var(--faint); font-size: 11.5px; padding-top: 2px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .line:hover .ts { color: var(--dim); }
  .txt { overflow-wrap: anywhere; }

  .IC      { color: var(--IC); }
  .OOC     { color: var(--OOC); font-style: italic; }
  .FACTION { color: var(--FACTION); font-style: italic; }
  .ME      { color: var(--ME); font-weight: 600; }
  .DO      { color: var(--DO); font-weight: 600; }
  .RADIO   { color: var(--RADIO); }

  .empty {
    max-width: 46ch;
    padding: 64px 0 0;
    color: var(--dim);
    font-family: var(--ui);
    line-height: 1.6;
  }
  .empty strong { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; font-weight: 600; }

  footer {
    padding: 14px 32px;
    border-top: 1px solid var(--line);
    color: var(--faint);
    font-size: 13px;
    display: flex; justify-content: space-between;
  }

  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); padding: 22px 20px; }
    .top, .bar, footer { padding-left: 20px; padding-right: 20px; }
    .bar { position: static; }
    #output { padding: 8px 20px 40px; }
    .line { grid-template-columns: minmax(0, 1fr); row-gap: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

<body>
<header class="top">
  <div class="brand">Leo<span>Sight</span></div>
  <div class="sub">Filtr logů V3</div>
</header>

<div class="layout">
  <aside>
    <div class="field">
      <div class="title">Vstup <small id="charCount">0 znaků</small></div>
      <textarea id="input" placeholder="Vlož sem log z chatu…" spellcheck="false"></textarea>
    </div>

    <div class="field">
      <div class="title">Typy zpráv</div>
      <div class="chips">
        <label class="chip" data-t="IC"><input type="checkbox" id="ic" checked><span>IC <i class="n" data-n="IC">0</i></span></label>
        <label class="chip" data-t="OOC"><input type="checkbox" id="ooc" checked><span>OOC <i class="n" data-n="OOC">0</i></span></label>
        <label class="chip" data-t="FACTION"><input type="checkbox" id="faction" checked><span>Frakční <i class="n" data-n="FACTION">0</i></span></label>
        <label class="chip" data-t="ME"><input type="checkbox" id="me" checked><span>/me <i class="n" data-n="ME">0</i></span></label>
        <label class="chip" data-t="DO"><input type="checkbox" id="do" checked><span>/do <i class="n" data-n="DO">0</i></span></label>
        <label class="chip" data-t="RADIO"><input type="checkbox" id="radio" checked><span>Vysílačka <i class="n" data-n="RADIO">0</i></span></label>
      </div>
    </div>

    <div class="field">
      <div class="title">Zobrazení</div>
      <div class="toggles">
        <label class="toggle">Časové razítko <input type="checkbox" id="timestamp" checked><span class="switch"></span></label>
        <label class="toggle">Jazyk u zprávy <input type="checkbox" id="language" checked><span class="switch"></span></label>
      </div>
    </div>
  </aside>

  <main>
    <div class="bar">
      <span class="meta" id="resultMeta"></span>
      <button class="clear" onclick="clearAll()">Vymazat</button>
      <button class="copy" id="copyBtn" onclick="copyOutput()" disabled>Kopírovat výstup</button>
    </div>
    <div id="output"></div>
  </main>
</div>

<footer>
  <span>Dzardys</span>
  <span id="footerStatus"></span>
</footer>

<script>
const EMPTY_HTML = '<div class="empty"><strong>Zatím tu nic není</strong>Vlož log do pole vlevo. Výstup se vyfiltruje hned a můžeš ho zkopírovat tlačítkem nahoře.</div>';

function normalize(line) {
  return line.trim().replace(/\s+/g, ' ');
}

function mergeLines(rawLines) {
  const result = [];

  for (let i = 0; i < rawLines.length; i++) {
    let line = rawLines[i].trim();
    if (!line) continue;

    if (/^\d{1,2}\.\d{1,2}\.\d{4}\d{2}:\d{2}:\d{2}/.test(line)) {
      result.push(line);
      continue;
    }

    if (/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(line)) {
      const date = line;
      const time = rawLines[i + 1]?.trim();
      const text = rawLines[i + 2]?.trim();

      if (/^\d{2}:\d{2}:\d{2}$/.test(time) && text) {
        result.push(`${date}${time}${text}`);
        i += 2;
        continue;
      }
    }

    result.push(line);
  }

  return result;
}

function parseLine(line) {
  line = normalize(line);

  const ts = line.match(/^(\d{1,2}\.\d{1,2}\.\d{4})(\d{2}:\d{2}:\d{2})/);
  if (!ts) return null;

  const [, date, time] = ts;
  const body = line.slice(ts[0].length).trim();

  if (/^\[(GM|GA|ADM|AT|MONITOR|UNBUG)\]/.test(body)) return null;
  if (/^INZERÁT:/.test(body)) return null;
  if (/Počasí změneno/.test(body)) return null;

  let m;

  m = body.match(/^\(\(([^)]+)\)\)\s+(.+?):\s*(.+)$/);
  if (m) return { type: "FACTION", channel: m[1], name: m[2], text: m[3], date, time };

  m = body.match(/^(.+?):\s*\(\((.+)\)\)$/);
  if (m) return { type: "OOC", name: m[1], text: `((${m[2]}))`, date, time };

  m = body.match(/^\(\((.+)\)\)$/);
  if (m) return { type: "OOC", text: `((${m[1]}))`, date, time };

  m = body.match(/^\[(?!GM|GA|ADM|AT|MONITOR|UNBUG)(.+?)\]\s+\[((?:\d+\|)?#\d+)\]\s+(.+?)\s+říká:\s*(.+)$/);
  if (m) return { type: "RADIO", lang: m[1], channel: m[2], name: m[3], text: m[4], date, time };

  m = body.match(/^\[((?:\d+\|)?#\d+)\]\s+(.+?)\s+říká:\s*(.+)$/);
  if (m) return { type: "RADIO", channel: m[1], name: m[2], text: m[3], date, time };

  m = body.match(/^★\s*(.+?)\s*\(\((.+?)\)\)$/);
  if (m) return { type: "DO", text: `${m[1]} ((${m[2]}))`, date, time };

  m = body.match(/^[★*]\s?(.+)/);
  if (m) return { type: "ME", text: m[1], date, time };

  m = body.match(/^\[(?!GM|GA|ADM|AT|MONITOR|UNBUG)(.+?)\]\s+(.+?)\s+říká:\s*(.+)$/);
  if (m) return { type: "IC", lang: m[1], name: m[2], text: m[3], date, time };

  return null;
}

let debounceTimer = null;

function scheduleProcess() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(process, 120);
}

function process() {
  const raw = document.getElementById("input").value;
  const lines = mergeLines(raw.split("\n"));

  const showTs = document.getElementById("timestamp").checked;
  const showLang = document.getElementById("language").checked;

  const filters = {
    IC: document.getElementById("ic").checked,
    OOC: document.getElementById("ooc").checked,
    FACTION: document.getElementById("faction").checked,
    ME: document.getElementById("me").checked,
    DO: document.getElementById("do").checked,
    RADIO: document.getElementById("radio").checked
  };

  const counts = { IC: 0, OOC: 0, FACTION: 0, ME: 0, DO: 0, RADIO: 0 };
  const output = document.getElementById("output");
  const frag = document.createDocumentFragment();
  let count = 0;

  for (const line of lines) {
    const p = parseLine(line);
    if (!p) continue;
    counts[p.type]++;
    if (!filters[p.type]) continue;
    count++;

    const row = document.createElement("div");
    row.className = "line";
    row.dataset.t = p.type;

    let plain = "";

    if (showTs) {
      const ts = document.createElement("span");
      ts.className = "ts";
      ts.textContent = `${p.date} ${p.time}`;
      row.appendChild(ts);
      plain += ts.textContent + "  ";
    }

    let txt = "";
    if (showLang && p.lang) txt += `[${p.lang}] `;
    if (p.channel) txt += `[${p.channel}] `;
    if (p.name) txt += `${p.name}: `;
    txt += p.text;

    const body = document.createElement("span");
    body.className = `txt ${p.type}`;
    body.textContent = txt;
    row.appendChild(body);

    row.dataset.plain = plain + txt;
    frag.appendChild(row);
  }

  output.innerHTML = "";
  if (count > 0) output.appendChild(frag);
  else if (!raw.trim()) output.innerHTML = EMPTY_HTML;
  else output.innerHTML = '<div class="empty"><strong>Nic nenalezeno</strong>V logu není žádná zpráva vybraného typu. Zkontroluj filtry vlevo, nebo jestli má každý řádek datum a čas.</div>';

  document.querySelectorAll("[data-n]").forEach(el => { el.textContent = counts[el.dataset.n]; });

  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  document.getElementById("resultMeta").textContent =
    raw.trim() ? (count ? `Zobrazeno ${count} z ${total} řádků` : "Žádné shody") : "";
  document.getElementById("footerStatus").textContent = count ? `${count} záznamů` : "";
  document.getElementById("copyBtn").disabled = count === 0;
}

function copyOutput() {
  const rows = document.getElementById("output").querySelectorAll(".line");
  if (!rows.length) return;

  const text = Array.from(rows).map(r => r.dataset.plain).join("\n");

  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("copyBtn");
    const orig = "Kopírovat výstup";
    btn.textContent = "Zkopírováno";
    btn.classList.add("copied");
    setTimeout(() => {
      btn.textContent = orig;
      btn.classList.remove("copied");
    }, 2000);
  });
}

function clearAll() {
  document.getElementById("input").value = "";
  document.getElementById("charCount").textContent = "0 znaků";
  process();
}

document.getElementById("input").addEventListener("input", function () {
  document.getElementById("charCount").textContent = `${this.value.length.toLocaleString("cs")} znaků`;
  scheduleProcess();
});

["ic", "ooc", "faction", "me", "do", "radio", "timestamp", "language"].forEach(id => {
  document.getElementById(id).addEventListener("change", process);
});

process();
</script>
</body>
</html>
